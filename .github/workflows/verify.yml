name: verify

on:
  push:
    branches: [main]
    tags: ["go-*"]
  pull_request:
  workflow_dispatch:

env:
  GOOGOO_VERSION: v0.1.18-go.7
  SPAGO_VERSION: 1.0.3

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - uses: oven-sh/setup-bun@v2

      - name: Install Spago
        run: |
          bun add --global spago@${SPAGO_VERSION}
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install googoo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GOOGOO_VERSION" -R i-am-the-slime/iris-go-backend -p 'googoo-x86_64-unknown-linux-gnu.tar.gz' -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/googoo-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/googoo-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Verify the package set
        run: |
          googoo --version
          googoo run -p verify-runner
